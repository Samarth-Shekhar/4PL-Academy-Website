kind = "web"
previewPath = "/"
title = "4PL Academy"
description = "4PL Academy’s education discovery platform, with university and program search, professional courses, admissions enquiries, ACAD BOT and a secure content-management system."
version = "1.0.0"
id = "artifacts/academy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18540

[services.development]
run = "pnpm --filter @workspace/academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/academy", "run", "build" ]
serve = "static"
publicDir = "artifacts/academy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18540"
BASE_PATH = "/"
